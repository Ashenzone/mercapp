<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produto · Mercapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar"></aside>

  <main class="main">
    <div id="conteudo">Carregando...</div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

function estrelas(media) {
  const cheias = Math.round(media);
  return '★'.repeat(cheias) + '☆'.repeat(5 - cheias);
}

async function carregar() {
  const resp = await fetch(`${API}/products/${id}`);
  if (!resp.ok) {
    document.getElementById('conteudo').innerHTML = '<div class="empty">Produto nao encontrado.</div>';
    return;
  }
  const p = await resp.json();
  const capa = p.cover_image_url
    ? `style="background-image:url('${p.cover_image_url}')"`
    : '';

  document.getElementById('conteudo').innerHTML = `
    <div class="page-head">
      <div>
        <div class="badge">${p.category_name || 'sem categoria'}</div>
        <div class="badge">${p.product_type}</div>
      </div>
    </div>
    <div class="detail">
      <div class="cover-lg" ${capa}></div>
      <div class="panel">
        <h1>${p.name}</h1>
        <div class="stars">${estrelas(p.rating_avg)} <span class="num">${Number(p.rating_avg).toFixed(1)}</span> (${p.rating_count} avaliacoes)</div>
        <div class="price-lg num">${formatarPreco(p.price_cents)}</div>
        <p>${p.description || 'Sem descricao.'}</p>
        <p style="color:var(--text-dim); font-size:13px;">
          Vendido por <strong>${p.company_name}</strong> ·
          ${p.views_count} visualizacoes · ${p.sales_count} vendas
        </p>
        <div class="badge" style="background:#e6f3c9;color:var(--signal-dim);">
          Quem compra na simulacao sao os bots consumidores do mercado
        </div>
        <p style="color:var(--text-dim); font-size:13px; margin-top:8px;">
          Quer mais vendas? Invista em <a href="trafego-pago.html">trafego pago</a> ou
          acompanhe as <a href="tendencias.html">tendencias</a> pra ajustar preco e categoria.
        </p>
      </div>
    </div>
  `;
}
carregar();
</script>
</body>
</html>
