<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Empresa · Mercapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Minha Empresa</h1>
        <div class="sub">Sua marca dentro do marketplace.</div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <form id="form-empresa" class="form-grid">
      <div class="field full">
        <label>Nome da empresa</label>
        <input name="name" required>
      </div>
      <div class="field full">
        <label>Descricao</label>
        <textarea name="description"></textarea>
      </div>
      <div class="field full">
        <label>Logo (URL)</label>
        <input name="logo_url" type="url">
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Salvar</button>
      </div>
    </form>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script>
const form = document.getElementById('form-empresa');

function kpi(label, value) {
  return `<div class="kpi"><div class="label">${label}</div><div class="value num">${value}</div></div>`;
}

async function carregar() {
  const id = await garantirEmpresa();
  const resp = await fetch(`${API}/companies/${id}`);
  const empresa = await resp.json();
  form.name.value = empresa.name;
  form.description.value = empresa.description || '';
  form.logo_url.value = empresa.logo_url || '';
  document.getElementById('kpis').innerHTML =
    kpi('Saldo', formatarPreco(empresa.balance_cents)) +
    kpi('Reputacao', Number(empresa.reputation).toFixed(1) + ' / 5');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  toast('Edicao de empresa sera concluida quando o cadastro multiusuario existir (fase futura).');
});

carregar();
</script>
</body>
</html>
